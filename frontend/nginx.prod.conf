# Conserve le protocole public transmis par le reverse proxy externe.
# Repli sur le schéma local si le header est absent.
map $http_x_forwarded_proto $climbcrew_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les imports de sauvegarde PostgreSQL sont limités côté API à 50 Mo.
    # Une petite marge évite qu'un dump valide soit bloqué par Nginx.
    client_max_body_size 55m;

    # En-têtes sécurité pour le frontend. HSTS reste au niveau du reverse proxy HTTPS externe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $climbcrew_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # MediaPipe doit rester compatible avec la CSP stricte (script-src/connect-src 'self').
    # Les ressources externes sont donc relayées côté serveur et exposées en même origine.
    location = /mediapipe-runtime/models/pose_landmarker_lite.task {
        proxy_ssl_server_name on;
        proxy_ssl_name storage.googleapis.com;
        proxy_set_header Host storage.googleapis.com;
        proxy_pass https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /mediapipe-runtime/ {
        proxy_ssl_server_name on;
        proxy_ssl_name cdn.jsdelivr.net;
        proxy_set_header Host cdn.jsdelivr.net;
        proxy_pass https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
