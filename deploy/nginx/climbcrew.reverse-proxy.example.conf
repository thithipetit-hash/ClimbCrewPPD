# Exemple Nginx à installer côté serveur hôte, pas dans l'application.
# Le certificat SSL/TLS est géré par le responsable serveur / reverse proxy.

server {
    listen 80;
    server_name climbcrew.dip-tcs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name climbcrew.dip-tcs.com;

    # À adapter par le responsable serveur.
    ssl_certificate     /etc/letsencrypt/live/climbcrew.dip-tcs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/climbcrew.dip-tcs.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # L'application accepte les vidéos jusqu'à 50 Mo. Garder une petite marge
    # évite qu'un fichier valide soit rejeté par le reverse proxy HTTPS externe.
    client_max_body_size 55m;

    # API Node locale.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Frontend statique servi par le conteneur frontend sur le port local 8080.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
