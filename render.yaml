# =============================================================================
# ClimbCrewPPD - Blueprint Render de préproduction
# =============================================================================
# Cette cible est volontairement distincte du serveur Linux de production.
# Elle provisionne une API, un frontend statique et une base PostgreSQL dédiés
# à la PPD. Aucun secret n'est stocké dans Git.

services:
  - type: web
    name: ClimbCrewPPD-api
    runtime: node
    plan: free
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"

      - key: DATABASE_URL
        fromDatabase:
          name: ClimbCrewPPD-db
          property: connectionString
      - key: PG_SSL
        value: "false"

      # Le frontend Render est l'unique origine publique autorisée en PPD.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: ClimbCrewPPD-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: ClimbCrewPPD-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: ClimbCrewPPD-frontend
          envVarKey: RENDER_EXTERNAL_URL

      # Frontend et API Render ont des origines différentes : cookies Secure,
      # SameSite=None et pont CSRF explicitement limité à l'origine PPD.
      - key: SECURE_COOKIES
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CROSS_ORIGIN_CSRF_BRIDGE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: climbcrew_ppd_session
      - key: CSRF_COOKIE_NAME
        value: climbcrew_ppd_csrf
      - key: SESSION_DURATION_DAYS
        value: "7"

      - key: SETUP_TOKEN
        generateValue: true

      # Les identifiants initiaux restent saisis dans Render et hors Git.
      # Le bootstrap reste actif en PPD afin qu'une base neuve soit utilisable
      # dès son premier démarrage ; dès qu'un administrateur actif existe,
      # l'initialiseur n'écrase plus son compte ni son mot de passe.
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_FIRST_ADMIN_BOOTSTRAP
        value: "true"
      - key: ALLOW_WEAK_FIRST_ADMIN_PASSWORD
        value: "false"
      - key: BCRYPT_ROUNDS
        value: "12"

      # La PPD ne doit pas envoyer de courriels ni expédier des sauvegardes.
      - key: EMAIL_ENABLED
        value: "false"
      - key: BACKUP_ENABLED
        value: "false"
      - key: REQUIRE_ADMIN_ACCOUNT_APPROVAL
        value: "false"
      - key: RESET_TOKEN_DURATION_MINUTES
        value: "60"
      - key: MAX_JSON_BODY_SIZE
        value: 10mb
      - key: WRITE_RATE_LIMIT_PER_MINUTE
        value: "120"

  - type: web
    name: ClimbCrewPPD-frontend
    runtime: static
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm ci --no-audit --no-fund && VITE_API_URL="https://${CLIMBCREW_PPD_API_HOST}/api" VITE_CSRF_COOKIE_NAME=climbcrew_ppd_csrf npm run build
    staticPublishPath: dist
    envVars:
      - key: CLIMBCREW_PPD_API_HOST
        fromService:
          type: web
          name: ClimbCrewPPD-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: ClimbCrewPPD-db
    plan: free
