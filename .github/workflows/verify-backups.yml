name: Vérifier les sauvegardes

on:
  workflow_run:
    workflows:
      - Validate and Deploy
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-backups.yml

permissions:
  contents: read

concurrency:
  group: climbcrew-backup-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier la sauvegarde PostgreSQL
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Contrôler les outils et le répertoire
        shell: bash
        run: |
          set -euo pipefail

          cd /opt/climbcrew
          test -f .env.production
          docker ps --format '{{.Names}}' | grep -qx 'climbcrew-backend'

          for command in pg_dump pg_restore psql; do
            docker exec climbcrew-backend sh -lc "command -v $command >/dev/null"
          done

          docker exec climbcrew-backend sh -lc 'test -d /backups && test -w /backups'
          echo "Outils PostgreSQL et répertoire /backups : OK"

      - name: Vérifier et restaurer le dump journalier après 03h00
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_HOUR="$(TZ=Europe/Paris date +%H)"
          LOCAL_DATE="$(TZ=Europe/Paris date +%F)"
          LOCAL_WEEKDAY="$(TZ=Europe/Paris date +%u)"

          if [ "$((10#$LOCAL_HOUR))" -lt 3 ]; then
            echo "Il est avant 03:00 à Paris : aucun dump journalier n'est encore attendu."
            exit 0
          fi

          FILE_NAME="climbcrew-scheduled-${LOCAL_DATE}-030000.dump"
          HOST_FILE="/opt/climbcrew/backups/${FILE_NAME}"

          FOUND=false
          for attempt in $(seq 1 18); do
            if [ -s "$HOST_FILE" ]; then
              FOUND=true
              break
            fi
            echo "Sauvegarde pas encore visible (${attempt}/18), nouvel essai dans 5s..."
            sleep 5
          done

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: sauvegarde journalière absente : $HOST_FILE"
            docker logs --tail 100 climbcrew-backend || true
            exit 1
          fi

          docker exec climbcrew-backend pg_restore --list "/backups/${FILE_NAME}" >/dev/null
          SIZE="$(stat -c %s "$HOST_FILE")"

          RESTORE_CONTAINER="climbcrew-backup-restore-check-${GITHUB_RUN_ID}"
          RESTORE_PASSWORD="climbcrew-restore-check"
          cleanup() {
            docker rm -f "$RESTORE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --rm \
            --name "$RESTORE_CONTAINER" \
            -e POSTGRES_PASSWORD="$RESTORE_PASSWORD" \
            -e POSTGRES_DB=climbcrew_restore_check \
            postgres:16-alpine >/dev/null

          READY=false
          for attempt in $(seq 1 30); do
            if docker exec "$RESTORE_CONTAINER" pg_isready -U postgres -d climbcrew_restore_check >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: PostgreSQL temporaire non prêt"
            docker logs "$RESTORE_CONTAINER" || true
            exit 1
          fi

          docker cp "$HOST_FILE" "$RESTORE_CONTAINER:/tmp/backup.dump"
          docker exec \
            -e PGPASSWORD="$RESTORE_PASSWORD" \
            "$RESTORE_CONTAINER" \
            pg_restore --exit-on-error --no-owner --no-privileges \
              -U postgres -d climbcrew_restore_check /tmp/backup.dump

          for table in participants sessions realisations routes; do
            EXISTS="$(docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$RESTORE_CONTAINER" \
              psql -U postgres -d climbcrew_restore_check -Atqc \
              "select to_regclass('public.${table}') is not null")"
            if [ "$EXISTS" != "t" ]; then
              echo "ERROR: table attendue absente après restauration : ${table}"
              exit 1
            fi
          done

          docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$RESTORE_CONTAINER" \
            psql -U postgres -d climbcrew_restore_check -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from participants; select count(*) from sessions; select count(*) from realisations; select count(*) from routes;" \
            >/dev/null

          echo "Sauvegarde journalière restaurée et vérifiée : ${FILE_NAME} (${SIZE} octets)"

          if [ "$LOCAL_WEEKDAY" = "1" ]; then
            if [ -f "${HOST_FILE}.mailed" ]; then
              echo "Envoi du lundi : marqué comme envoyé avec succès."
            else
              echo "::warning::Le dump du lundi est présent mais aucun marqueur d'envoi e-mail réussi n'est encore visible."
            fi
          fi

          {
            echo "### Sauvegarde PostgreSQL"
            echo "- Dump : \`${FILE_NAME}\`"
            echo "- Taille : ${SIZE} octets"
            echo "- Intégrité pg_restore : OK"
            echo "- Restauration PostgreSQL temporaire : OK"
            echo "- Tables essentielles : participants, sessions, realisations, routes : OK"
            if [ "$LOCAL_WEEKDAY" = "1" ]; then
              if [ -f "${HOST_FILE}.mailed" ]; then
                echo "- E-mail du lundi : OK"
              else
                echo "- E-mail du lundi : en attente / à contrôler"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
