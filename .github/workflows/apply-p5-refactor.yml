name: Apply P5 Refactor

on:
  push:
    branches:
      - refactor/frontend-bootstrap-20260830-016

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-bootstrap-20260830-016
      - name: Appliquer le refactoring App bootstrap
        shell: bash
        run: |
          set -euo pipefail
          echo "Avant : $(sha256sum frontend/src/App.jsx)"
          grep -n "useAppBootstrap\|Recharge toutes les données" frontend/src/App.jsx || true
          node scripts/refactor-app-bootstrap.mjs
          echo "Après : $(sha256sum frontend/src/App.jsx)"
          grep -n "useAppBootstrap\|Recharge toutes les données" frontend/src/App.jsx || true
          git status --short frontend/src/App.jsx
          git diff -- frontend/src/App.jsx | head -200 || true
          if git diff --quiet -- frontend/src/App.jsx; then
            echo "ERROR: la transformation n'a produit aucune modification alors que App.jsx n'est pas encore refactoré."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx
          git commit -m "refactor: delegate app bootstrap to hook"
          git push origin HEAD:refactor/frontend-bootstrap-20260830-016
