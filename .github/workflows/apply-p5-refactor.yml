name: Apply P5 Refactor

on:
  push:
    branches:
      - refactor/frontend-bootstrap-20260830-016

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-bootstrap-20260830-016
      - name: Appliquer le refactoring App bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refactor-app-bootstrap.mjs
          grep -q 'useAppBootstrap' frontend/src/App.jsx
          ! grep -q 'Recharge toutes les données depuis le backend' frontend/src/App.jsx

          git update-index --no-assume-unchanged frontend/src/App.jsx || true
          git update-index --no-skip-worktree frontend/src/App.jsx || true
          git add -f frontend/src/App.jsx

          if git diff --cached --quiet -- frontend/src/App.jsx; then
            echo "ERROR: App.jsx transformé mais aucun diff indexé."
            git ls-files -v frontend/src/App.jsx || true
            git check-attr -a -- frontend/src/App.jsx || true
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: delegate app bootstrap to hook"
          git push origin HEAD:refactor/frontend-bootstrap-20260830-016
