name: Ensure preproduction video upload proxy

on:
  push:
    branches:
      - main
      - fix/preprod-nginx-upload-v005
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climbcrew-preprod-nginx-upload-limit
  cancel-in-progress: false

jobs:
  nginx_video_upload_limit:
    name: Mesurer la limite du frontal vidéo
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Mesurer les tailles acceptées
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_DOMAIN="pre-climbcrew.dip-tcs.com"
          NGINX_DUMP="$(sudo nginx -T 2>&1)"
          printf '%s\n' "$NGINX_DUMP" \
            | grep -E '^(# configuration file |[[:space:]]*(server_name|proxy_pass|client_max_body_size)[[:space:]])' \
            | head -n 250 || true

          PROBE_DOMAIN="$(printf '%s\n' "$NGINX_DUMP" | awk '
            /server_name[[:space:]]/ && $2 != "_" && $2 != "localhost;" {
              name=$2
              sub(/;$/, "", name)
            }
            /proxy_pass[[:space:]]+http:\/\/127\.0\.0\.1:3000/ {
              if (name != "") { print name; exit }
            }
          ')"
          if [ -z "$PROBE_DOMAIN" ]; then
            PROBE_DOMAIN="$EXPECTED_DOMAIN"
          fi
          echo "Domaine de test : $PROBE_DOMAIN"

          PASSING_KIB=0
          for SIZE_KIB in 128 256 512 768 1024 1536 2048 3072 4096 5120; do
            PROBE_FILE="$(mktemp)"
            BODY_FILE="$(mktemp)"
            HEADER_FILE="$(mktemp)"
            dd if=/dev/zero of="$PROBE_FILE" bs=1K count="$SIZE_KIB" status=none
            HTTP_CODE="$(curl --insecure --silent --show-error \
              --dump-header "$HEADER_FILE" --output "$BODY_FILE" \
              --write-out '%{http_code}' --max-time 60 \
              -X POST -H 'Content-Type: application/octet-stream' \
              --data-binary "@$PROBE_FILE" \
              "https://${PROBE_DOMAIN}/api/realisations/proxy-limit-probe/video-uploads/proxy-probe-1234/chunks/0" || true)"
            echo "PROBE ${SIZE_KIB} KiB -> HTTP ${HTTP_CODE}"
            grep -Ei '^(server:|content-type:|content-length:)' "$HEADER_FILE" | tr -d '\r' || true
            if [ "$HTTP_CODE" != "413" ] && [ "$HTTP_CODE" != "000" ] && [[ ! "$HTTP_CODE" =~ ^5 ]]; then
              PASSING_KIB="$SIZE_KIB"
            fi
            rm -f "$PROBE_FILE" "$BODY_FILE" "$HEADER_FILE"
          done

          echo "Plus grand bloc accepté pendant ce diagnostic : ${PASSING_KIB} KiB"
          if [ "$PASSING_KIB" -lt 128 ]; then
            echo "ERROR: même un bloc de 128 KiB ne traverse pas le frontal."
            exit 1
          fi
