name: Verify production video chunks

on:
  workflow_run:
    workflows:
      - Validate and Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climbcrew-production-video-chunk-probe
  cancel-in-progress: false

jobs:
  verify_video_chunk:
    name: Vérifier le passage d'un bloc vidéo de 768 Kio
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'production') }}
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Vérifier Nginx local et le frontal public de production
        shell: bash
        run: |
          set -euo pipefail

          DOMAIN="climbcrew.dip-tcs.com"
          NGINX_DUMP="$(sudo nginx -T 2>&1)"

          echo "=== Proxy Nginx local ==="
          printf '%s\n' "$NGINX_DUMP" \
            | grep -E '^(# configuration file |[[:space:]]*(server_name|proxy_pass|client_max_body_size)[[:space:]])' \
            | head -n 250 || true

          if ! printf '%s\n' "$NGINX_DUMP" | grep -qE 'server_name[[:space:]]+climbcrew\.dip-tcs\.com'; then
            echo "ERROR: le runner ne publie pas climbcrew.dip-tcs.com."
            exit 1
          fi

          if ! printf '%s\n' "$NGINX_DUMP" | grep -qE 'client_max_body_size[[:space:]]+55m;'; then
            echo "ERROR: le Nginx local ClimbCrew n'est pas configuré avec la limite 55m attendue."
            exit 1
          fi

          PROBE_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$PROBE_FILE" "$BODY_FILE"' EXIT
          dd if=/dev/zero of="$PROBE_FILE" bs=1K count=768 status=none

          HTTP_CODE="$(curl --silent --show-error --output "$BODY_FILE" \
            --write-out '%{http_code}' --max-time 60 \
            -X POST -H 'Content-Type: application/octet-stream' \
            --data-binary "@$PROBE_FILE" \
            "https://${DOMAIN}/api/realisations/proxy-limit-probe/video-uploads/proxy-probe-1234/chunks/0" || true)"

          echo "Bloc 768 Kio -> HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "413" ]; then
            echo "ERROR: le frontal refuse un bloc de 768 Kio."
            exit 1
          fi
          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ] || [[ "$HTTP_CODE" =~ ^5 ]]; then
            echo "ERROR: le contrôle du frontal n'a pas abouti correctement."
            exit 1
          fi

          echo "OK: un bloc de 768 Kio traverse le frontal de production."
