name: Inspecter les logs du backend pre-prod

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Nombre de lignes de log à afficher'
        required: false
        default: '200'
        type: string

permissions:
  contents: read

jobs:
  logs:
    name: Récupérer les logs du conteneur backend (lecture seule)
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Afficher les logs récents de climbcrew-backend
        shell: bash
        env:
          LOG_LINES: ${{ inputs.lines }}
        run: |
          set +e
          {
            echo "### Logs récents de climbcrew-backend"
            echo
            echo '```'
            docker logs --tail "${LOG_LINES:-200}" climbcrew-backend 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
