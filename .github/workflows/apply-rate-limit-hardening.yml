name: Apply Rate Limit Hardening

on:
  push:
    paths:
      - .github/workflows/apply-rate-limit-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply security hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          server_path = Path('backend/server.js')
          source = server_path.read_text()

          old_rate = '''const rateLimitBuckets = new Map();
          function rateLimit({ keyPrefix, windowMs, max }) {
            return (req, res, next) => {
              const key = `${keyPrefix}:${getClientIp(req) || "unknown"}`;
              const now = Date.now();
              const current = rateLimitBuckets.get(key) || { count: 0, resetAt: now + windowMs };
              if (current.resetAt <= now) {
                current.count = 0;
                current.resetAt = now + windowMs;
              }
              current.count += 1;
              rateLimitBuckets.set(key, current);
              if (current.count > max) {
                return res.status(429).json({ error: "Trop de tentatives. Réessaie plus tard." });
              }
              next();
            };
          }
          '''
          new_rate = '''const rateLimitBuckets = new Map();
          const RATE_LIMIT_CLEANUP_INTERVAL_MS = 60 * 1000;
          let nextRateLimitCleanupAt = 0;

          function cleanupExpiredRateLimitBuckets(now = Date.now()) {
            if (now < nextRateLimitCleanupAt) return;
            for (const [key, bucket] of rateLimitBuckets.entries()) {
              if (!bucket || bucket.resetAt <= now) rateLimitBuckets.delete(key);
            }
            nextRateLimitCleanupAt = now + RATE_LIMIT_CLEANUP_INTERVAL_MS;
          }

          function rateLimit({ keyPrefix, windowMs, max }) {
            return (req, res, next) => {
              const now = Date.now();
              cleanupExpiredRateLimitBuckets(now);
              const key = `${keyPrefix}:${getClientIp(req) || "unknown"}`;
              const current = rateLimitBuckets.get(key) || { count: 0, resetAt: now + windowMs };
              if (current.resetAt <= now) {
                current.count = 0;
                current.resetAt = now + windowMs;
              }
              current.count += 1;
              rateLimitBuckets.set(key, current);
              if (current.count > max) {
                return res.status(429).json({ error: "Trop de tentatives. Réessaie plus tard." });
              }
              next();
            };
          }
          '''
          if old_rate not in source:
              raise SystemExit('rate limiter block not found')
          source = source.replace(old_rate, new_rate, 1)

          old_ip = '''function getClientIp(req) {
            const forwarded = req.headers["x-forwarded-for"];
            if (typeof forwarded === "string" && forwarded.length > 0) {
              return forwarded.split(",")[0].trim();
            }
            return req.ip || null;
          }
          '''
          new_ip = '''function getClientIp(req) {
            // Express calcule req.ip à partir de la socket et de la configuration
            // `trust proxy`. Ne jamais relire X-Forwarded-For ici : cela contournerait
            // précisément la chaîne de confiance configurée par Express.
            return req.ip || null;
          }
          '''
          if old_ip not in source:
              raise SystemExit('getClientIp block not found')
          source = source.replace(old_ip, new_ip, 1)
          server_path.write_text(source)

          test_path = Path('backend/test/rate-limit-hardening.test.js')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\nconst source = await readFile(new URL("../server.js", import.meta.url), "utf8");\n\ntest("client IP relies on Express trust proxy resolution", () => {\n  const match = source.match(/function getClientIp\\(req\\) \\{([\\s\\S]*?)\\n\\}/);\n  assert.ok(match, "getClientIp must exist");\n  assert.match(match[1], /req\\.ip/);\n  assert.doesNotMatch(match[1], /x-forwarded-for/i);\n});\n\ntest("expired rate-limit buckets are periodically purged", () => {\n  assert.match(source, /function cleanupExpiredRateLimitBuckets/);\n  assert.match(source, /rateLimitBuckets\\.delete\\(key\\)/);\n  assert.match(source, /cleanupExpiredRateLimitBuckets\\(now\\)/);\n});\n''')

          version_path = Path('VERSION')
          current = version_path.read_text().strip()
          prefix, number = current.rsplit('.', 1)
          version_path.write_text(f'{prefix}.{int(number) + 1:03d}\n')

          Path('.github/workflows/apply-rate-limit-hardening.yml').unlink()

      - name: Run backend tests
        working-directory: backend
        run: npm ci --no-audit --no-fund && npm test

      - name: Commit hardened code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/server.js backend/test/rate-limit-hardening.test.js VERSION .github/workflows/apply-rate-limit-hardening.yml
          git commit -m "fix(security): harden rate limiting"
          git push origin HEAD:main
