name: Apply frontend polish 005

on:
  push:
    branches:
      - refactor/frontend-polish-20260905-005
    paths:
      - .github/workflows/apply-frontend-polish-005.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-polish-20260905-005
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Préparer la suppression du token frontend legacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("frontend/src/App.jsx")
          app = app_path.read_text()
          app = app.replace(
              '<FaqSection APP_VERSION={APP_VERSION} canAccessAdminTabs={canAccessAdminTabs} USE_API={USE_API} authToken={authToken} authUser={authUser} />',
              '<FaqSection APP_VERSION={APP_VERSION} canAccessAdminTabs={canAccessAdminTabs} USE_API={USE_API} authUser={authUser} />',
          )
          app_path.write_text(app)

          faq_path = Path("frontend/src/sections/FaqSection.jsx")
          faq = faq_path.read_text()
          faq = faq.replace(
              'export default function FaqSection({ APP_VERSION, canAccessAdminTabs, USE_API, authToken, authUser }) {',
              'export default function FaqSection({ APP_VERSION, canAccessAdminTabs, USE_API, authUser }) {',
          )
          faq = faq.replace(
              '<DemandesEvolution USE_API={USE_API} authToken={authToken} authUser={authUser} />',
              '<DemandesEvolution USE_API={USE_API} authUser={authUser} />',
          )
          faq_path.write_text(faq)

          demandes_path = Path("frontend/src/pages/DemandesEvolution.jsx")
          demandes = demandes_path.read_text()
          demandes = demandes.replace('import { authApiFetch } from "../lib/api.js";', 'import { apiFetch } from "../lib/api.js";')
          demandes = demandes.replace('export default function DemandesEvolution({ USE_API, authToken, authUser }) {', 'export default function DemandesEvolution({ USE_API, authUser }) {')
          demandes = demandes.replace('authApiFetch(', 'apiFetch(')
          demandes = demandes.replace(', authToken, {', ', {')
          demandes = demandes.replace(', authToken)', ')')
          demandes = demandes.replace('useEffect(() => { loadRequests(); }, [USE_API, authToken]);', 'useEffect(() => { loadRequests(); }, [USE_API, authUser?.id]);')
          demandes_path.write_text(demandes)
          PY
      - name: Appliquer la migration
        run: node scripts/apply-frontend-polish-005.mjs
      - name: Aligner les tests avec l'architecture finale
        shell: bash
        run: |
          cat > frontend/test/app-bootstrap-hook.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const app = fs.readFileSync(new URL("../src/App.jsx", import.meta.url), "utf8");
          const hook = fs.readFileSync(new URL("../src/hooks/useAppBootstrap.js", import.meta.url), "utf8");

          test("App délègue le bootstrap API et authentification", () => {
            assert.match(app, /useAppBootstrap\(/);
            assert.doesNotMatch(app, /authApiFetch|authToken|setAuthToken/);
            assert.doesNotMatch(app, /Recharge toutes les données depuis le backend/);
          });

          test("le hook de bootstrap centralise chargement, identité et messages via le cookie HttpOnly", () => {
            assert.match(hook, /apiFetch\("\/participants"/);
            assert.match(hook, /apiFetch\("\/sessions"/);
            assert.match(hook, /apiFetch\("\/routes"/);
            assert.match(hook, /apiFetch\("\/auth\/me"/);
            assert.match(hook, /apiFetch\("\/auth\/broadcast-messages\/pending"/);
            assert.doesNotMatch(hook, /authApiFetch|authToken|setAuthToken/);
            assert.match(hook, /return \{ reloadApiState \}/);
          });
          EOF

          cat > frontend/test/optional-realisation-rating.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          test("l'évaluation d'une réalisation reste facultative après extraction du payload", async () => {
            const [appSource, modalSource, workflowSource] = await Promise.all([
              readFile(new URL("../src/App.jsx", import.meta.url), "utf8"),
              readFile(new URL("../src/components/RealisationModal.jsx", import.meta.url), "utf8"),
              readFile(new URL("../src/lib/realisation-workflow.js", import.meta.url), "utf8"),
            ]);
            assert.match(appSource, /if \(!newRealisation\.participantId \|\| !newRealisation\.selectedDay \|\| !newRealisation\.voieId\) \{/);
            assert.doesNotMatch(appSource, /!newRealisation\.voieId \|\| !newRealisation\.rating/);
            assert.match(appSource, /buildRealisationPayload\(\{/);
            assert.match(workflowSource, /rating >= 1 && rating <= 5 \? \{ rating \} : \{\}/);
            assert.match(appSource, /<RealisationModal/);
            assert.match(modalSource, /Évaluation de la voie \(facultative\)/);
            assert.doesNotMatch(modalSource, /Cotation consensus/);
            assert.doesNotMatch(modalSource, /!newRealisation\.rating/);
          });
          EOF

          cat > frontend/test/realisation-mode-react.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { access, readFile } from "node:fs/promises";
          import { buildRealisationPayload } from "../src/lib/realisation-workflow.js";

          const legacyUiUrl = new URL("../src/realisation-mode-ui.js", import.meta.url);
          const requestBridgeUrl = new URL("../src/lib/realisation-request-mode.js", import.meta.url);
          const mainUrl = new URL("../src/main.jsx", import.meta.url);
          const modalUrl = new URL("../src/components/RealisationModal.jsx", import.meta.url);
          const progressionUrl = new URL("../src/pages/Progression.jsx", import.meta.url);
          const profileUrl = new URL("../src/pages/Profil.jsx", import.meta.url);
          const hookUrl = new URL("../src/hooks/useRealisationEditorState.js", import.meta.url);
          const appUrl = new URL("../src/App.jsx", import.meta.url);

          const [mainSource, modalSource, progressionSource, profileSource, hookSource, appSource] = await Promise.all([
            readFile(mainUrl, "utf8"), readFile(modalUrl, "utf8"), readFile(progressionUrl, "utf8"),
            readFile(profileUrl, "utf8"), readFile(hookUrl, "utf8"), readFile(appUrl, "utf8"),
          ]);

          test("le POST d'une nouvelle réalisation transporte directement le mode choisi", () => {
            const payload = buildRealisationPayload({
              draft: { participantId: "p1", selectedDay: "2026-09-05", voieId: "v1", modeRealisation: "moulinette", styleRealisation: "a_vue" },
              sessionId: "s1", now: () => 1,
            });
            assert.equal(payload.modeRealisation, "moulinette");
            assert.equal(payload.styleRealisation, "a_vue");
          });

          test("le mode et le critère sont rendus et transportés directement par React", async () => {
            await assert.rejects(access(legacyUiUrl));
            await assert.rejects(access(requestBridgeUrl));
            assert.equal(mainSource.includes("realisation-mode-ui.js"), false);
            assert.match(hookSource, /modeRealisation: "en_tete"/);
            assert.match(modalSource, /<label>Mode<\/label>/);
            assert.match(modalSource, /<label>Critère<\/label>/);
            assert.doesNotMatch(modalSource, /setPendingRealisationMode|realisation-request-mode/);
            assert.match(appSource, /buildRealisationPayload\(\{/);
            assert.match(progressionSource, /getRealisationMode\(realisation, route\)/);
            assert.match(profileSource, /getRealisationMode\(realisation, route\)/);
            assert.doesNotMatch(`${modalSource}\n${progressionSource}\n${profileSource}`, /MutationObserver|window\.location\.reload|querySelectorAll/);
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/test/ui-density.test.js")
          source = path.read_text().replace(
              'assert.match(css, /@media (max-width:700px)/);',
              'assert.match(css, /@media \\(max-width:700px\\)/);',
          )
          path.write_text(source)
          PY
      - name: Vérifier le frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Committer le résultat validé
        shell: bash
        run: |
          set -euo pipefail
          # Le jeton Actions ne peut pas modifier les workflows. La correction
          # du nom d'expéditeur sera appliquée séparément via le connecteur GitHub.
          git restore .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-frontend-polish-005.mjs
          git add -A
          git commit -m "Finalise et homogénéise le frontend 20260905.005"
          git push origin HEAD:refactor/frontend-polish-20260905-005
