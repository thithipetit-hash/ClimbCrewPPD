name: Apply audit fixes once

on:
  push:
    branches:
      - audit-fixes-20260829

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Corriger le script préparatoire
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-audit-fixes.mjs')
          s = p.read_text()
          s = s.replace(';nbroadcastTest =', ';\nbroadcastTest =')
          s = s.replace('${rating} étoile', '\\${rating} étoile')
          p.write_text(s)
          PY
          node --check scripts/apply-audit-fixes.mjs
      - name: Appliquer les corrections
        run: node scripts/apply-audit-fixes.mjs
      - name: Adapter les tests aux composants extraits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/test/route-ratings.test.js')
          s = p.read_text()
          s = s.replace(
            '  const source = await readFile(new URL("../src/App.jsx", import.meta.url), "utf8");\n  const voies =',
            '  const source = await readFile(new URL("../src/App.jsx", import.meta.url), "utf8");\n  const modal = await readFile(new URL("../src/components/RealisationModal.jsx", import.meta.url), "utf8");\n  const voies =',
          )
          for marker in [
            r'/\[1, 2, 3, 4, 5\]\.map/',
            r'/role="radiogroup"/',
            r'/newRealisation\.rating/',
            r'/rating <= newRealisation\.rating/',
            r'/\? "★" : "☆"/',
          ]:
            s = s.replace(f'assert.match(source, {marker});', f'assert.match(modal, {marker});')
          p.write_text(s)

          p = Path('frontend/test/route-save-feedback.test.js')
          s = p.read_text()
          old = '  const source = await readFile(new URL("../src/App.jsx", import.meta.url), "utf8");\n  // Le select de voie de la fenêtre de progression a été extrait dans pages/Progression.jsx.'
          new = '  const modal = await readFile(new URL("../src/components/RealisationModal.jsx", import.meta.url), "utf8");\n  // Le select de voie de la fenêtre de progression a été extrait dans pages/Progression.jsx.'
          s = s.replace(old, new)
          s = s.replace('assert.match(source, /formatRouteForRealisation\\(realisationModalRoute\\)/);', 'assert.match(modal, /formatRouteForRealisation\\(route\\)/);')
          p.write_text(s)
          PY
      - name: Tester le backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test
          node --check server.js
          node --check realisation-management-routes.js
          node --check realisation-integrity.js
      - name: Tester et construire le frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Commit du chantier
        run: |
          set -euo pipefail
          rm -f scripts/apply-audit-fixes.mjs .github/workflows/apply-audit-fixes-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: sécuriser réalisations et extraire modales'
          git push origin HEAD:audit-fixes-20260829
