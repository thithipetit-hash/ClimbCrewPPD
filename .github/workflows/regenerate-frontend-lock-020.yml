name: Regenerate frontend lock 020

on:
  push:
    branches:
      - audit-020-hardening
    paths:
      - frontend/package.json
      - .github/workflows/regenerate-frontend-lock-020.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-020-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate frontend package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchroniser le lock frontend pour Playwright 1.63.0"
          git push origin HEAD:audit-020-hardening
