name: Deploy merged main PR

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: read

concurrency:
  group: climbcrew-merged-main-deploy-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    name: Déclencher le pipeline PPD après fusion
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier que main pointe sur le commit fusionné
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/branches/main" \
              | node --input-type=module -e '
                  let body = "";
                  process.stdin.on("data", (chunk) => body += chunk);
                  process.stdin.on("end", () => {
                    const data = JSON.parse(body);
                    process.stdout.write(String(data?.commit?.sha || ""));
                  });
                '
          )"
          test -n "$MAIN_SHA"
          [ "$MAIN_SHA" = "$MERGE_SHA" ] || {
            echo "ERROR: main ($MAIN_SHA) ne pointe pas sur le merge SHA attendu ($MERGE_SHA)."
            exit 1
          }
          echo "main confirmé sur le merge SHA $MERGE_SHA."

      - name: Déclencher Validate and Deploy sur main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(
            curl --silent --show-error \
              --output /tmp/dispatch-response.txt \
              --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
              -d '{"ref":"main","inputs":{"branch":"main"}}'
          )"
          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: impossible de déclencher Validate and Deploy (HTTP $HTTP_CODE)."
            cat /tmp/dispatch-response.txt || true
            exit 1
          fi
          echo "Pipeline Validate and Deploy déclenché sur main."
