name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climbcrew-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on production server
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check production environment file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "/opt/climbcrew/.env.production" ]; then
            echo "ERROR: /opt/climbcrew/.env.production not found."
            echo "Please create it manually before deploying."
            exit 1
          fi

          echo ".env.production found"

      - name: Deploy to production
        shell: bash
        run: |
          set -euo pipefail

          cd /opt/climbcrew

          echo "=== Synchronizing the selected stable version ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Building and starting containers ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

          echo "=== Deployment completed ==="
