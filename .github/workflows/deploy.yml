name: Validate and Deploy

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to validate/deploy'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - production

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: climbcrew-validation-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation du code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validated_sha: ${{ steps.validated_commit.outputs.sha }}
      deploy_branch: ${{ steps.validated_commit.outputs.branch }}
    steps:
      - name: Récupérer le dépôt à valider
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.sha }}
          fetch-depth: 2

      - name: Identifier le commit validé
        id: validated_commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          VALIDATED_SHA="$(git rev-parse HEAD)"
          case "$EVENT_NAME" in
            workflow_dispatch) DEPLOY_BRANCH="$INPUT_BRANCH" ;;
            pull_request) DEPLOY_BRANCH="$BASE_REF" ;;
            *) DEPLOY_BRANCH="$REF_NAME" ;;
          esac
          test -n "$VALIDATED_SHA"
          test -n "$DEPLOY_BRANCH"
          printf 'sha=%s\n' "$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Commit validé : $VALIDATED_SHA"
          echo "Branche cible : $DEPLOY_BRANCH"

      - name: Refuser un push direct sur main
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_SHA: ${{ steps.validated_commit.outputs.sha }}
        run: |
          set -euo pipefail
          PULLS_JSON="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${VALIDATED_SHA}/pulls"
          )"
          PULLS_JSON="$PULLS_JSON" node --input-type=module -e '
            const pulls = JSON.parse(process.env.PULLS_JSON || "[]");
            const mergedIntoMain = pulls.some((pr) => pr?.merged_at && pr?.base?.ref === "main");
            if (!mergedIntoMain) {
              console.error("Push direct sur main refusé : le commit doit provenir d une pull request fusionnée.");
              process.exit(1);
            }
            console.log("Politique main OK : commit issu d une pull request fusionnée.");
          '

      - name: Vérifier l'incrément de version
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/verify-version.sh

      - name: Valider les scripts de déploiement P0
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/scripts/install-preprod-nginx.sh
          bash -n deploy/scripts/rollback-preprod.sh
          grep -Fq '__PPD_DOMAIN__' deploy/nginx/pre-climbcrew.reverse-proxy.conf.template
          grep -Fq '__SSL_CERTIFICATE__' deploy/nginx/pre-climbcrew.reverse-proxy.conf.template
          grep -Fq '__SSL_CERTIFICATE_KEY__' deploy/nginx/pre-climbcrew.reverse-proxy.conf.template

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Auditer les dépendances frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Tester le frontend
        working-directory: frontend
        run: npm test

      - name: Construire le frontend
        working-directory: frontend
        run: npm run build

      - name: Installer le backend
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Auditer les dépendances backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Vérifier la syntaxe du backend
        working-directory: backend
        run: node --check server.js

      - name: Tester le backend
        working-directory: backend
        run: npm test

  integration:
    name: Intégration API et PostgreSQL
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: climbcrew_test
          POSTGRES_USER: climbcrew_test
          POSTGRES_PASSWORD: climbcrew_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climbcrew_test -d climbcrew_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Récupérer exactement le commit validé
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer le backend
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Tester les flux critiques avec une vraie base PostgreSQL
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: '3100'
          DATABASE_URL: postgres://climbcrew_test:climbcrew_test_password@127.0.0.1:5432/climbcrew_test
          PG_SSL: 'false'
          PUBLIC_URL: http://127.0.0.1:5173
          FRONTEND_ORIGIN: http://127.0.0.1:5173
          CORS_ORIGIN: http://127.0.0.1:5173
          SECURE_COOKIES: 'false'
          COOKIE_SAMESITE: lax
          EMAIL_ENABLED: 'false'
          BACKUP_ENABLED: 'false'
          REQUIRE_ADMIN_ACCOUNT_APPROVAL: 'false'
          ALLOW_FIRST_ADMIN_BOOTSTRAP: 'true'
          FIRST_ADMIN_EMAIL: admin@integration.test
          FIRST_ADMIN_PASSWORD: Integration_Admin1!
          ALLOW_WEAK_FIRST_ADMIN_PASSWORD: 'false'
          BCRYPT_ROUNDS: '10'
        run: node integration/security-flow.integration.mjs

  linux_validate:
    name: Validation Linux bloquante
    needs: validate
    uses: ./.github/workflows/validate-linux.yml
    with:
      ref: ${{ needs.validate.outputs.validated_sha }}

  deploy:
    name: Déployer la préproduction
    needs: [validate, integration, linux_validate]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.validate.outputs.deploy_branch == 'main' }}
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      DEPLOY_ROOT: /opt/climbcrew
      PPD_DOMAIN: pre-climbcrew.dip-tcs.com
    steps:
      - name: Vérifier la cible de préproduction
        shell: bash
        run: |
          set -euo pipefail
          for command in git docker curl sudo nginx; do
            command -v "$command" >/dev/null 2>&1 || { echo "ERROR: commande absente: $command"; exit 1; }
          done
          docker compose version >/dev/null
          test -d "$DEPLOY_ROOT/.git" || { echo "ERROR: clone persistant absent: $DEPLOY_ROOT"; exit 1; }
          test -f "$DEPLOY_ROOT/.env.production" || { echo "ERROR: .env.production absent"; exit 1; }
          CURRENT_ORIGIN="$(cd "$DEPLOY_ROOT" && git remote get-url origin 2>/dev/null || true)"
          EXPECTED_ORIGIN="https://github.com/${GITHUB_REPOSITORY}.git"
          [ "$CURRENT_ORIGIN" = "$EXPECTED_ORIGIN" ] || { echo "ERROR: origin inattendu: $CURRENT_ORIGIN"; exit 1; }
          sudo nginx -t
          echo "Cible PPD confirmée: $DEPLOY_ROOT"

      - name: Sauvegarder et vérifier PostgreSQL avant bascule
        id: backup_db
        shell: bash
        run: |
          set -euo pipefail
          docker inspect climbcrew-db >/dev/null 2>&1 || { echo "ERROR: conteneur PostgreSQL PPD absent"; exit 1; }
          docker ps --format '{{.Names}}' | grep -qx 'climbcrew-db' || { echo "ERROR: PostgreSQL PPD arrêté"; exit 1; }
          BACKUP_DIR="$DEPLOY_ROOT/backups/predeploy"
          mkdir -p "$BACKUP_DIR"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_FILE="$BACKUP_DIR/predeploy-${STAMP}.dump"
          docker exec climbcrew-db sh -lc 'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"
          test -s "$BACKUP_FILE" || { echo "ERROR: sauvegarde PostgreSQL vide"; exit 1; }
          docker exec -i climbcrew-db pg_restore --list < "$BACKUP_FILE" >/dev/null
          sha256sum "$BACKUP_FILE"
          printf 'backup_file=%s\n' "$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          ls -1t "$BACKUP_DIR"/predeploy-*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f
          echo "Sauvegarde pré-déploiement créée et vérifiée: $BACKUP_FILE"

      - name: Synchroniser le dépôt sur le SHA PPD validé
        id: sync_repo
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          printf 'previous_sha=%s\n' "$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          FETCH_OK=false
          for attempt in 1 2 3 4 5; do
            if timeout 90s git fetch --no-tags --prune origin 'refs/heads/main:refs/remotes/origin/main'; then
              FETCH_OK=true
              break
            fi
            sleep $((attempt * 10))
          done
          [ "$FETCH_OK" = true ] || { echo "ERROR: git fetch impossible"; exit 1; }
          git cat-file -e "${VALIDATED_SHA}^{commit}" 2>/dev/null || { echo "ERROR: SHA validé absent"; exit 1; }
          git merge-base --is-ancestor "$VALIDATED_SHA" refs/remotes/origin/main || { echo "ERROR: SHA hors branche main"; exit 1; }
          git checkout -B main "$VALIDATED_SHA"
          [ "$(git rev-parse HEAD)" = "$VALIDATED_SHA" ] || exit 1
          printf 'candidate_checked_out=true\n' >> "$GITHUB_OUTPUT"
          echo "Préproduction verrouillée sur $VALIDATED_SHA (ancien SHA: $PREVIOUS_SHA)"

      - name: Installer le vhost PPD dédié
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"
          bash deploy/scripts/install-preprod-nginx.sh "$PPD_DOMAIN"

      - name: Synchroniser les secrets applicatifs disponibles
        shell: bash
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BACKUP_EMAIL_ENCRYPTION_KEY: ${{ secrets.BACKUP_EMAIL_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          ENV_FILE="$DEPLOY_ROOT/.env.production"
          set_env_var() {
            local key="$1" value="$2"
            if grep -q "^${key}=" "$ENV_FILE"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
            fi
          }
          set_env_var REQUIRE_ADMIN_ACCOUNT_APPROVAL true
          set_env_var ALLOW_FIRST_ADMIN_BOOTSTRAP false
          if [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASSWORD:-}" ]; then
            set_env_var EMAIL_ENABLED true
            set_env_var SMTP_HOST smtp.gmail.com
            set_env_var SMTP_PORT 587
            set_env_var SMTP_SECURE false
            set_env_var SMTP_REQUIRE_TLS true
            set_env_var SMTP_USER "$SMTP_USER"
            set_env_var SMTP_PASSWORD "$SMTP_PASSWORD"
            set_env_var EMAIL_FROM_NAME ClimbClubCristal
            set_env_var EMAIL_FROM_ADDRESS "$SMTP_USER"
          fi
          if [ -n "${BACKUP_EMAIL_ENCRYPTION_KEY:-}" ]; then
            set_env_var BACKUP_EMAIL_ENCRYPTION_KEY "$BACKUP_EMAIL_ENCRYPTION_KEY"
          fi
          echo "Configuration PPD synchronisée."

      - name: Construire et démarrer le SHA validé
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"
          export GITHUB_SHA="$VALIDATED_SHA"
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
          echo "Pile PPD démarrée pour $VALIDATED_SHA"

      - name: Contrôler la santé locale
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          BACKEND_OK=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/health >/dev/null; then
              BACKEND_OK=true
              break
            fi
            sleep 5
          done
          [ "$BACKEND_OK" = true ] || { docker logs --tail 200 climbcrew-backend || true; exit 1; }

          FRONTEND_OK=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8080/ >/dev/null; then
              FRONTEND_OK=true
              break
            fi
            sleep 5
          done
          [ "$FRONTEND_OK" = true ] || {
            docker compose --env-file "$DEPLOY_ROOT/.env.production" -f "$DEPLOY_ROOT/docker-compose.prod.yml" ps || true
            exit 1
          }
          echo "Backend OK · Frontend OK · SHA $VALIDATED_SHA"

      - name: Vérifier la version et le SHA sur le frontal PPD
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(tr -d '[:space:]' < "$DEPLOY_ROOT/VERSION")"
          LOCAL_MARKER="$(
            curl --fail --silent --max-time 10 \
              "http://127.0.0.1:8080/deployment-version.json?sha=${VALIDATED_SHA}"
          )"
          printf '%s' "$LOCAL_MARKER" | grep -Fq "\"version\": \"${EXPECTED_VERSION}\"" || {
            echo "ERROR: version locale inattendue"
            echo "$LOCAL_MARKER"
            exit 1
          }
          printf '%s' "$LOCAL_MARKER" | grep -Fq "\"commit\": \"${VALIDATED_SHA}\"" || {
            echo "ERROR: commit local inattendu"
            echo "$LOCAL_MARKER"
            exit 1
          }

          PUBLIC_OK=false
          for attempt in $(seq 1 12); do
            PUBLIC_MARKER="$(
              curl --fail --silent --show-error --location \
                --connect-timeout 5 --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "https://${PPD_DOMAIN}/deployment-version.json?sha=${VALIDATED_SHA}&attempt=${attempt}" \
                || true
            )"
            if printf '%s' "$PUBLIC_MARKER" | grep -Fq "\"version\": \"${EXPECTED_VERSION}\"" \
              && printf '%s' "$PUBLIC_MARKER" | grep -Fq "\"commit\": \"${VALIDATED_SHA}\""; then
              PUBLIC_OK=true
              break
            fi
            [ "$attempt" -eq 12 ] || sleep 5
          done
          [ "$PUBLIC_OK" = true ] || {
            echo "ERROR: le frontal PPD ne sert pas le SHA attendu avec un certificat TLS valide"
            echo "${PUBLIC_MARKER:-}"
            exit 1
          }

          {
            echo '### Déploiement préproduction ClimbCrew'
            echo "- Version: \`$EXPECTED_VERSION\`"
            echo "- SHA: \`$VALIDATED_SHA\`"
            echo "- Domaine: \`$PPD_DOMAIN\`"
            echo '- Vhost PPD dédié: OK'
            echo '- PostgreSQL sauvegardé et dump vérifié avant bascule'
            echo '- Backend: OK'
            echo '- Frontend: OK'
            echo '- Marqueur public HTTPS/TLS: OK'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restaurer automatiquement la PPD en cas d'échec
        if: ${{ failure() && steps.sync_repo.outputs.candidate_checked_out == 'true' && steps.backup_db.outputs.backup_file != '' }}
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.sync_repo.outputs.previous_sha }}
          BACKUP_FILE: ${{ steps.backup_db.outputs.backup_file }}
        run: |
          set -euo pipefail
          ROLLBACK_SCRIPT="$(mktemp)"
          cp "$DEPLOY_ROOT/deploy/scripts/rollback-preprod.sh" "$ROLLBACK_SCRIPT"
          chmod +x "$ROLLBACK_SCRIPT"
          trap 'rm -f "$ROLLBACK_SCRIPT"' EXIT
          "$ROLLBACK_SCRIPT" "$DEPLOY_ROOT" "$PREVIOUS_SHA" "$BACKUP_FILE" "$PPD_DOMAIN"
          PREVIOUS_VERSION="$(tr -d '[:space:]' < "$DEPLOY_ROOT/VERSION")"
          {
            echo '### Rollback automatique PPD'
            echo "- SHA restauré: \`$PREVIOUS_SHA\`"
            echo "- Version restaurée: \`$PREVIOUS_VERSION\`"
            echo "- Base PostgreSQL restaurée depuis: \`$BACKUP_FILE\`"
            echo '- Marqueur public restauré: OK'
          } >> "$GITHUB_STEP_SUMMARY"
