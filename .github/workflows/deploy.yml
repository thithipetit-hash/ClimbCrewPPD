name: Validate and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: climbcrew-validation-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La validation reste exécutée sur un runner GitHub éphémère. Ce runner a
  # besoin de actions/checkout car il ne conserve pas de clone entre deux runs.
  validate:
    name: Validation du code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validated_sha: ${{ steps.validated_commit.outputs.sha }}
      deploy_branch: ${{ steps.validated_commit.outputs.branch }}

    steps:
      - name: Récupérer le dépôt à valider
        uses: actions/checkout@v7
        with:
          # Un déclenchement manuel peut demander une branche précise. Dans les
          # autres cas, le SHA de l'événement est validé sans ambiguïté.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.sha }}
          fetch-depth: 2

      - name: Identifier le commit validé
        id: validated_commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VALIDATED_SHA="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_BRANCH="$INPUT_BRANCH"
          else
            DEPLOY_BRANCH="$REF_NAME"
          fi

          if [ -z "$VALIDATED_SHA" ] || [ -z "$DEPLOY_BRANCH" ]; then
            echo "ERROR: impossible de déterminer le SHA ou la branche validée."
            exit 1
          fi

          printf 'sha=%s\n' "$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Commit à valider : $VALIDATED_SHA"
          echo "Branche associée : $DEPLOY_BRANCH"

      - name: Vérifier l'incrément de version
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/verify-version.sh

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci a échoué (tentative ${attempt}/3), nouvel essai dans 5s..."
            sleep 5
          done
          exit 1

      - name: Tester le frontend
        working-directory: frontend
        run: npm test

      - name: Construire le frontend
        working-directory: frontend
        run: npm run build

      - name: Installer le backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci a échoué (tentative ${attempt}/3), nouvel essai dans 5s..."
            sleep 5
          done
          exit 1

      - name: Vérifier la syntaxe du backend
        working-directory: backend
        run: node --check server.js

      - name: Tester le backend
        working-directory: backend
        run: npm test

  # Le runner de production possède un clone persistant dans /opt/climbcrew.
  # Il n'utilise volontairement aucune action `uses:` : cela évite notamment
  # qu'un HTTP 429 de codeload.github.com sur actions/checkout bloque le serveur
  # avant même l'exécution des commandes de déploiement.
  deploy:
    name: Déployer sur le serveur de production
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Vérifier le runner et l'environnement de production
        shell: bash
        env:
          DEPLOY_ROOT: /opt/climbcrew
        run: |
          set -euo pipefail

          for command in git docker curl awk; do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "ERROR: commande requise absente du runner : $command"
              exit 1
            fi
          done

          if ! docker compose version >/dev/null 2>&1; then
            echo "ERROR: le plugin Docker Compose n'est pas disponible."
            exit 1
          fi

          if [ ! -d "$DEPLOY_ROOT/.git" ]; then
            echo "ERROR: $DEPLOY_ROOT n'est pas un clone Git persistant."
            echo "Initialiser le dépôt sur le serveur avant de relancer le workflow."
            exit 1
          fi

          if [ ! -f "$DEPLOY_ROOT/.env.production" ]; then
            echo "ERROR: $DEPLOY_ROOT/.env.production not found."
            echo "Please create it manually before deploying."
            exit 1
          fi

          cd "$DEPLOY_ROOT"
          echo "Runner prêt. HEAD actuel : $(git rev-parse HEAD)"
          echo "Remote origin : $(git remote get-url origin)"
          echo ".env.production found"

      - name: Synchroniser le dépôt local avec le SHA validé
        id: sync_repo
        shell: bash
        env:
          DEPLOY_ROOT: /opt/climbcrew
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
          DEPLOY_BRANCH: ${{ needs.validate.outputs.deploy_branch }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_ROOT"

          if ! git check-ref-format --branch "$DEPLOY_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: nom de branche invalide : $DEPLOY_BRANCH"
            exit 1
          fi

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          printf 'previous_sha=%s\n' "$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          echo "SHA actuellement présent sur le serveur : $PREVIOUS_SHA"
          echo "SHA validé à déployer : $VALIDATED_SHA"
          echo "Branche source : $DEPLOY_BRANCH"

          FETCH_REFSPEC="refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
          FETCH_OK=false

          # Le fetch utilise Git directement et tolère les incidents réseau
          # transitoires. Chaque tentative est limitée dans le temps.
          for attempt in 1 2 3 4 5; do
            echo "git fetch : tentative ${attempt}/5"
            if timeout 90s git fetch --no-tags --prune origin "$FETCH_REFSPEC"; then
              FETCH_OK=true
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "Fetch impossible, nouvel essai dans ${delay}s..."
              sleep "$delay"
            fi
          done

          if [ "$FETCH_OK" != "true" ]; then
            echo "ERROR: impossible de synchroniser le dépôt après 5 tentatives."
            echo "La version actuellement présente n'est pas modifiée."
            exit 1
          fi

          # Le commit validé doit exister après le fetch de la branche. Si le
          # clone du serveur est peu profond, une tentative ciblée est effectuée.
          if ! git cat-file -e "${VALIDATED_SHA}^{commit}" 2>/dev/null; then
            echo "SHA validé absent du clone local, tentative de récupération ciblée."
            for attempt in 1 2 3; do
              if timeout 90s git fetch --no-tags origin "$VALIDATED_SHA"; then
                break
              fi
              sleep $((attempt * 10))
            done
          fi

          if ! git cat-file -e "${VALIDATED_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: le SHA validé $VALIDATED_SHA est introuvable sur le runner."
            exit 1
          fi

          # En cas d'avance normale de la branche entre validation et
          # déploiement, le SHA validé reste un ancêtre et peut être déployé.
          # Un force-push qui l'aurait retiré de la branche bloque le déploiement.
          if ! git merge-base --is-ancestor "$VALIDATED_SHA" "refs/remotes/origin/$DEPLOY_BRANCH"; then
            echo "ERROR: le SHA validé n'appartient plus à la branche distante $DEPLOY_BRANCH."
            echo "Relancer une validation sur l'état actuel de la branche."
            exit 1
          fi

          git reset --hard "$VALIDATED_SHA"

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$VALIDATED_SHA" ]; then
            echo "ERROR: HEAD=$ACTUAL_SHA alors que $VALIDATED_SHA était attendu."
            exit 1
          fi

          echo "Dépôt verrouillé sur le SHA validé : $ACTUAL_SHA"

      - name: Synchroniser les identifiants SMTP dans .env.production
        shell: bash
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
            echo "SMTP_USER/SMTP_PASSWORD secrets not set, leaving .env.production untouched."
            exit 0
          fi

          ENV_FILE="/opt/climbcrew/.env.production"
          umask 077

          set_env_var() {
            local key="$1"
            local value="$2"
            local tmp

            if [[ ! "$key" =~ ^[A-Z0-9_]+$ ]]; then
              echo "ERROR: invalid environment variable name"
              return 1
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "ERROR: multiline values are not supported in .env.production"
              return 1
            fi

            tmp="$(mktemp "${ENV_FILE}.tmp.XXXXXX")"
            awk -v key="$key" -v value="$value" '
              BEGIN { found = 0; prefix = key "=" }
              index($0, prefix) == 1 {
                if (!found) print prefix value
                found = 1
                next
              }
              { print }
              END { if (!found) print prefix value }
            ' "$ENV_FILE" > "$tmp"

            chmod --reference="$ENV_FILE" "$tmp" 2>/dev/null || chmod 600 "$tmp"
            mv "$tmp" "$ENV_FILE"
          }

          set_env_var "EMAIL_ENABLED" "true"
          set_env_var "SMTP_HOST" "smtp.gmail.com"
          set_env_var "SMTP_PORT" "587"
          set_env_var "SMTP_SECURE" "false"
          set_env_var "SMTP_REQUIRE_TLS" "true"
          set_env_var "SMTP_USER" "${SMTP_USER}"
          set_env_var "SMTP_PASSWORD" "${SMTP_PASSWORD}"
          set_env_var "EMAIL_FROM_NAME" "ClimbClubCristal"
          set_env_var "EMAIL_FROM_ADDRESS" "${SMTP_USER}"
          echo "SMTP credentials synced into .env.production without exposing secret values"

      - name: Construire et démarrer la version validée
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail
          cd /opt/climbcrew

          echo "=== Building and starting validated commit $VALIDATED_SHA ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

      - name: Contrôler la santé après déploiement
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          set -euo pipefail

          echo "=== Checking backend health ==="
          BACKEND_OK=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/health >/dev/null; then
              BACKEND_OK=true
              break
            fi
            echo "Backend pas encore prêt (${attempt}/24)"
            sleep 5
          done

          if [ "$BACKEND_OK" != "true" ]; then
            echo "ERROR: backend health check failed"
            docker logs --tail 200 climbcrew-backend || true
            exit 1
          fi

          echo "=== Checking frontend ==="
          FRONTEND_OK=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8080/ >/dev/null; then
              FRONTEND_OK=true
              break
            fi
            echo "Frontend pas encore prêt (${attempt}/12)"
            sleep 5
          done

          if [ "$FRONTEND_OK" != "true" ]; then
            echo "ERROR: frontend health check failed"
            docker compose --env-file /opt/climbcrew/.env.production -f /opt/climbcrew/docker-compose.prod.yml ps || true
            exit 1
          fi

          echo "Backend healthy"
          echo "Frontend healthy"
          echo "=== Deployment completed for $VALIDATED_SHA ==="

          {
            echo "### Déploiement ClimbCrew"
            echo "- Commit validé et déployé : \`$VALIDATED_SHA\`"
            echo "- Backend : OK"
            echo "- Frontend : OK"
          } >> "$GITHUB_STEP_SUMMARY"
