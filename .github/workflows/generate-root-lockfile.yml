name: Generate Root Lockfile

on:
  push:
    branches:
      - chore/pin-eslint-20260830-017

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pin-eslint-20260830-017
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Générer et valider le lockfile racine
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile déjà à jour."
            exit 0
          fi
          git commit -m "chore: lock root ESLint dependency"
          git push origin HEAD:chore/pin-eslint-20260830-017
