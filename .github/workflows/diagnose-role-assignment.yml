name: Diagnose role assignment PPD

on:
  push:
    branches:
      - diagnose/role-assignment

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Vérifier les associations comptes / participants qualifiés
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i climbcrew-db sh -lc 'exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -F "|" -A' <<'SQL'
          select
            p.id as participant_id,
            coalesce(u.id::text, 'none') as user_id,
            coalesce(u.status, 'none') as user_status,
            coalesce(u.role, 'none') as user_role,
            p.can_encadrer,
            p.can_referer,
            case
              when u.id is null then false
              else lower(trim(coalesce(u.email,''))) = lower(trim(coalesce(nullif(p.login_email,''), p.email, '')))
            end as email_match,
            case
              when u.id is null then false
              else lower(trim(coalesce(u.prenom,''))) = lower(trim(coalesce(p.prenom,'')))
               and lower(trim(coalesce(u.nom,''))) = lower(trim(coalesce(p.nom,'')))
            end as name_match
          from participants p
          left join users u on u.participant_id = p.id
          where p.can_encadrer = true or p.can_referer = true
          order by p.id, u.id;

          select
            'duplicate_qualified_name' as issue,
            string_agg(p.id::text, ',' order by p.id) as participant_ids,
            count(*)::text as count
          from participants p
          where p.can_encadrer = true or p.can_referer = true
          group by lower(trim(coalesce(p.prenom,''))), lower(trim(coalesce(p.nom,'')))
          having count(*) > 1
          union all
          select
            'duplicate_qualified_email' as issue,
            string_agg(p.id::text, ',' order by p.id) as participant_ids,
            count(*)::text as count
          from participants p
          where (p.can_encadrer = true or p.can_referer = true)
            and trim(coalesce(nullif(p.login_email,''), p.email, '')) <> ''
          group by lower(trim(coalesce(nullif(p.login_email,''), p.email, '')))
          having count(*) > 1;

          select
            u.id as user_id,
            u.participant_id as linked_participant_id,
            string_agg(other.id::text, ',' order by other.id) as alternative_qualified_participant_ids
          from users u
          join participants linked on linked.id = u.participant_id
          join participants other on other.id <> linked.id
            and (other.can_encadrer = true or other.can_referer = true)
            and (
              (
                trim(coalesce(u.email,'')) <> ''
                and lower(trim(coalesce(nullif(other.login_email,''), other.email, ''))) = lower(trim(u.email))
              )
              or (
                lower(trim(coalesce(other.prenom,''))) = lower(trim(coalesce(u.prenom,'')))
                and lower(trim(coalesce(other.nom,''))) = lower(trim(coalesce(u.nom,'')))
              )
            )
          where u.status = 'active'
          group by u.id, u.participant_id
          order by u.id;

          select
            s.id,
            s.date,
            s.slot,
            s.status,
            coalesce(s.encadrant_id::text, 'none') as encadrant_id,
            coalesce(s.referent_id::text, 'none') as referent_id,
            coalesce(pe.can_encadrer::text, 'none') as encadrant_qualified,
            coalesce(pr.can_referer::text, 'none') as referent_qualified,
            case
              when s.status = 'encadree' then s.referent_id is not null
              when s.status = 'libre' then s.encadrant_id is not null
              else s.encadrant_id is not null or s.referent_id is not null
            end as hidden_role_present
          from sessions s
          left join participants pe on pe.id = s.encadrant_id
          left join participants pr on pr.id = s.referent_id
          where s.date >= current_date - interval '30 days'
            and (s.encadrant_id is not null or s.referent_id is not null)
          order by s.date desc, s.slot, s.id
          limit 100;

          select
            id,
            coalesce(user_id::text, 'none') as user_id,
            event_type,
            success,
            created_at,
            coalesce(details->>'path', '') as path,
            coalesce(details->>'status_code', '') as status_code,
            coalesce(details->>'request_id', '') as request_id
          from access_logs
          where created_at >= now() - interval '2 hours'
          order by created_at desc
          limit 100;

          select
            'active_without_participant' as check_name,
            count(*)::text as value
          from users
          where status = 'active' and participant_id is null
          union all
          select
            'duplicate_participant_links',
            count(*)::text
          from (
            select participant_id
            from users
            where participant_id is not null
            group by participant_id
            having count(*) > 1
          ) duplicates;
          SQL
