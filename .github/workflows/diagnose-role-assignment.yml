name: Validate role assignment on PPD

on:
  push:
    branches:
      - diagnose/role-assignment

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Qualifier le compte de test comme encadrant et référent
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(docker exec -i climbcrew-db sh -lc 'exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -v ON_ERROR_STOP=1' <<'SQL'
          update participants
          set can_encadrer = true,
              can_referer = true
          where id = (select participant_id from users where id = 47)
          returning id::text || '|' || can_encadrer::text || '|' || can_referer::text;
          SQL
          )"
          printf '%s\n' "$RESULT" | grep -Fq '|true|true' || {
            echo "::error::Le compte de test n'a pas pu être qualifié correctement."
            exit 1
          }
          echo "Compte de test qualifié Encadrant + Référent sur la PPD."

      - name: Tester la mutation réelle du backend sur PostgreSQL PPD
        shell: bash
        run: |
          set -euo pipefail
          docker exec climbcrew-backend node --input-type=module <<'NODE'
          import { Pool } from "pg";
          import { setPool } from "./admin-users/database.js";
          import { updateSessionWithAuthorization } from "./admin-users/session-authorization-service.js";

          const pool = new Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: String(process.env.PG_SSL || "").toLowerCase() === "true"
              ? { rejectUnauthorized: false }
              : false,
          });
          setPool(pool);

          const userId = 47;
          const userResult = await pool.query(
            `select u.participant_id, p.can_encadrer, p.can_referer
             from users u
             join participants p on p.id = u.participant_id
             where u.id = $1`,
            [userId],
          );
          if (userResult.rowCount !== 1) throw new Error("Compte de test non associé.");
          const actor = userResult.rows[0];
          const participantId = String(actor.participant_id);
          if (!actor.can_encadrer || !actor.can_referer) {
            throw new Error("Qualifications Encadrant/Référent absentes.");
          }

          const fixtureReferentResult = await pool.query(
            `select id
             from participants
             where can_referer = true and id <> $1
             order by id
             limit 1`,
            [participantId],
          );
          if (!fixtureReferentResult.rowCount) throw new Error("Aucun référent de fixture disponible.");
          const fixtureReferentId = String(fixtureReferentResult.rows[0].id);

          const sessionId = `e2e-role-${Date.now()}`;
          const sessionDate = "2026-09-29";

          async function invoke(body) {
            const req = {
              params: { id: sessionId },
              body,
              auth: {
                user: {
                  id: String(userId),
                  participantId,
                  role: "user",
                },
              },
              headers: { "user-agent": "climbcrew-e2e-role-test" },
              ip: "127.0.0.1",
            };
            const res = {
              statusCode: 200,
              payload: null,
              status(code) {
                this.statusCode = code;
                return this;
              },
              json(payload) {
                this.payload = payload;
                return this;
              },
            };
            await updateSessionWithAuthorization(req, res);
            if (res.statusCode !== 200) {
              throw new Error(`HTTP ${res.statusCode}: ${JSON.stringify(res.payload)}`);
            }
            return res.payload;
          }

          try {
            await pool.query(
              `insert into sessions (id, date, slot, status, encadrant_id, referent_id)
               values ($1, $2, 'soir', 'libre', null, $3)`,
              [sessionId, sessionDate, fixtureReferentId],
            );

            await invoke({
              id: sessionId,
              date: sessionDate,
              slot: "soir",
              status: "encadree",
              encadrantId: participantId,
              referentId: null,
              participantIds: [],
            });

            let state = await pool.query(
              `select status, encadrant_id, referent_id from sessions where id = $1`,
              [sessionId],
            );
            let row = state.rows[0];
            if (
              row.status !== "encadree"
              || String(row.encadrant_id) !== participantId
              || row.referent_id !== null
            ) {
              throw new Error("Auto-affectation encadrant non persistée.");
            }
            console.log("OK : séance Libre avec autre référent -> Encadrée avec soi-même comme encadrant.");

            await invoke({
              id: sessionId,
              date: sessionDate,
              slot: "soir",
              status: "libre",
              encadrantId: null,
              referentId: participantId,
              participantIds: [],
            });

            state = await pool.query(
              `select status, encadrant_id, referent_id from sessions where id = $1`,
              [sessionId],
            );
            row = state.rows[0];
            if (
              row.status !== "libre"
              || row.encadrant_id !== null
              || String(row.referent_id) !== participantId
            ) {
              throw new Error("Auto-affectation référent non persistée.");
            }
            console.log("OK : passage en Libre avec soi-même comme référent.");

            await invoke({
              id: sessionId,
              date: sessionDate,
              slot: "soir",
              status: "libre",
              encadrantId: null,
              referentId: null,
              participantIds: [],
            });

            state = await pool.query(
              `select status, encadrant_id, referent_id from sessions where id = $1`,
              [sessionId],
            );
            row = state.rows[0];
            if (
              row.status !== "libre"
              || row.encadrant_id !== null
              || row.referent_id !== null
            ) {
              throw new Error("Retrait du référent non persisté.");
            }
            console.log("OK : retrait de son propre rôle de référent.");
            console.log("TEST E2E ROLE ASSIGNMENT: SUCCESS");
          } finally {
            await pool.query(`delete from sessions where id = $1`, [sessionId]).catch(() => undefined);
            await pool.end();
          }
          NODE
