name: Apply Legacy CSS Extraction

on:
  push:
    paths:
      - .github/workflows/apply-legacy-css-extraction.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract static legacy CSS
        shell: python
        run: |
          from pathlib import Path

          legacy_path = Path('frontend/src/climbcrew-enhancements-legacy.js')
          source = legacy_path.read_text()

          function_start = source.index('function injectStyles() {')
          css_marker = '  style.textContent = `'
          css_start = source.index(css_marker, function_start) + len(css_marker)
          css_end_marker = '`;\n  document.head.appendChild(style);'
          css_end = source.index(css_end_marker, css_start)
          function_end_marker = '  document.head.appendChild(style);\n}'
          function_end = source.index(function_end_marker, css_end) + len(function_end_marker)

          css = source[css_start:css_end].strip() + '\n'
          css_path = Path('frontend/src/styles/climbcrew-enhancements.css')
          css_path.write_text('/* Styles historiques extraits du module DOM legacy. */\n' + css)

          source = source[:function_start] + source[function_end:]
          source = source.replace('  injectStyles();\n', '')
          source = source.replace('injectStyles();\n', '')
          legacy_path.write_text(source)

          main_path = Path('frontend/src/main.jsx')
          main = main_path.read_text()
          import_line = 'import "./styles/climbcrew-enhancements.css";\n'
          if import_line not in main:
              anchor = 'import "./styles/index.css";\n'
              main = main.replace(anchor, import_line + anchor, 1)
          main_path.write_text(main)

          style_tests = [
              'frontend/test/accessibility.test.js',
              'frontend/test/route-editing.test.js',
              'frontend/test/route-rankings-tags.test.js',
              'frontend/test/route-ratings.test.js',
              'frontend/test/top-rope-display.test.js',
          ]
          for test_name in style_tests:
              path = Path(test_name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('../src/climbcrew-enhancements-legacy.js', '../src/styles/climbcrew-enhancements.css')
              path.write_text(text)

          version_path = Path('VERSION')
          current = version_path.read_text().strip()
          prefix, number = current.rsplit('.', 1)
          version_path.write_text(f'{prefix}.{int(number) + 1:03d}\n')

          Path('.github/workflows/apply-legacy-css-extraction.yml').unlink()

      - name: Verify extraction
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/src/styles/climbcrew-enhancements.css
          ! grep -q 'function injectStyles' frontend/src/climbcrew-enhancements-legacy.js
          ! grep -q 'style.textContent' frontend/src/climbcrew-enhancements-legacy.js
          grep -q 'climbcrew-enhancements.css' frontend/src/main.jsx

      - name: Run frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Commit extracted CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/climbcrew-enhancements-legacy.js frontend/src/styles/climbcrew-enhancements.css frontend/src/main.jsx frontend/test VERSION .github/workflows/apply-legacy-css-extraction.yml
          git commit -m "refactor(frontend): extract legacy CSS"
          git push origin HEAD:main
