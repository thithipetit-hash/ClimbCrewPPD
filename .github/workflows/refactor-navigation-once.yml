name: Refactor navigation once

on:
  push:
    branches: [main]
    paths:
      - scripts/refactor-navigation.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extraire la navigation
        run: node scripts/refactor-navigation.mjs
      - name: Commit du refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(frontend): extraire navigation"
          git push origin main
