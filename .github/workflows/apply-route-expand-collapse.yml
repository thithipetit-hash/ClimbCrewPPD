name: Apply route expand collapse

on:
  push:
    branches:
      - feature-route-expand-collapse-261007

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-route-expand-collapse-261007
          fetch-depth: 0

      - name: Apply route expand/collapse change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/pages/Voies.jsx")
          text = path.read_text()

          state_line = '  const [routeProgressError, setRouteProgressError] = React.useState("");'
          if state_line not in text:
              raise SystemExit("route progress state anchor not found")
          text = text.replace(
              state_line,
              state_line + '\n  const [expandedRouteIds, setExpandedRouteIds] = React.useState(() => new Set());',
              1,
          )

          function_line = '  function effectiveVideoUrls(route) {'
          functions = '''  function toggleRouteDetails(routeId) {
            const key = String(routeId);
            setExpandedRouteIds((current) => {
              const next = new Set(current);
              if (next.has(key)) next.delete(key);
              else next.add(key);
              return next;
            });
          }

          function handleRouteSummaryKeyDown(event, routeId) {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            toggleRouteDetails(routeId);
          }

          '''
          if function_line not in text:
              raise SystemExit("effectiveVideoUrls anchor not found")
          text = text.replace(function_line, functions + function_line, 1)

          video_line = '                    const videoCount = effectiveVideoUrls(route).length;'
          if video_line not in text:
              raise SystemExit("video count anchor not found")
          text = text.replace(
              video_line,
              '                    const routeRating = routeRatingsById[route.id] || { average: 0, count: 0 };\n' + video_line,
              1,
          )

          progress_line = '                    const myRouteProgress = realisationsByRoute.get(String(route.id)) || [];'
          if progress_line not in text:
              raise SystemExit("route progress anchor not found")
          text = text.replace(
              progress_line,
              progress_line + '\n                    const isExpanded = expandedRouteIds.has(String(route.id));',
              1,
          )

          summary_line = '                            <div className="route-summary">'
          summary_replacement = '''                            <div
                              className="route-summary"
                              role="button"
                              tabIndex={0}
                              aria-expanded={isExpanded}
                              aria-label={`${isExpanded ? "Masquer" : "Afficher"} les détails de ${formatRouteName(route)}`}
                              onClick={() => toggleRouteDetails(route.id)}
                              onKeyDown={(event) => handleRouteSummaryKeyDown(event, route.id)}
                              style={{ cursor: "pointer", flex: 1 }}
                            >'''
          if summary_line not in text:
              raise SystemExit("route summary anchor not found")
          text = text.replace(summary_line, summary_replacement, 1)

          primary_line = '                              <strong className="route-primary-line">{route.cotationAjustee || route.cotationReference || "nc"} · {route.couleurPrises || "Sans couleur"}</strong>'
          primary_replacement = '''                              <strong className="route-primary-line">
                                {route.cotationAjustee || route.cotationReference || "nc"} · {route.couleurPrises || "Sans couleur"}
                                <span className="small" aria-hidden="true" style={{ marginLeft: 8 }}>{isExpanded ? "▴" : "▾"}</span>
                              </strong>'''
          if primary_line not in text:
              raise SystemExit("route primary line anchor not found")
          text = text.replace(primary_line, primary_replacement, 1)

          progress_display = '                              <div className="route-meta-line" aria-label="Réalisation du grimpeur connecté">{formatRouteProgress(myRouteProgress, route)}</div>'
          details = '''                              <div className="route-meta-line" aria-label="Réalisation du grimpeur connecté">{formatRouteProgress(myRouteProgress, route)}</div>
                              {isExpanded && (
                                <div
                                  className="route-expanded-details"
                                  aria-label="Détails complets de la voie"
                                  style={{ marginTop: 10, display: "grid", gap: 4 }}
                                >
                                  <div><strong>Nom :</strong> {route.nomVoie || "Sans nom"}</div>
                                  <div><strong>Corde :</strong> {normalizeRopeNumber(route.numeroCorde)}</div>
                                  <div><strong>Couleur :</strong> {route.couleurPrises || "Sans couleur"}</div>
                                  <div><strong>Ouvreur :</strong> {route.nomOuvreur || "Non renseigné"}</div>
                                  <div><strong>Cotation de référence :</strong> {route.cotationReference || "nc"}</div>
                                  <div><strong>Cotation ajustée :</strong> {route.cotationAjustee || route.cotationReference || "nc"}</div>
                                  <div><strong>Consensus :</strong> {routeAggregatesById[route.id]?.consensusGrade || "nc"}</div>
                                  <div><strong>Type :</strong> {route.moulinetteOnly ? "Moulinette uniquement" : "En tête / Moulinette"}</div>
                                  <div><strong>Caractéristiques :</strong> {route.tags?.length > 0 ? route.tags.map((tag) => ROUTE_TAGS.find((item) => item.value === tag)?.label || tag).join(", ") : "Aucune"}</div>
                                  <div><strong>Note :</strong> {routeRating.count ? `★ ${Number(routeRating.average || 0).toFixed(1)} · ${routeRating.count} avis` : "Aucun avis"}</div>
                                  <div><strong>Vidéos :</strong> {videoCount}</div>
                                </div>
                              )}'''
          if progress_display not in text:
              raise SystemExit("route progress display anchor not found")
          text = text.replace(progress_display, details, 1)
          path.write_text(text)

          Path("VERSION").write_text("261007.003\n")

          Path("frontend/test/route-expand-collapse.test.js").write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          test("chaque voie peut afficher puis masquer tous ses détails", async () => {
            const voies = await readFile(new URL("../src/pages/Voies.jsx", import.meta.url), "utf8");

            assert.match(voies, /expandedRouteIds/);
            assert.match(voies, /toggleRouteDetails\(routeId\)/);
            assert.match(voies, /aria-expanded=\{isExpanded\}/);
            assert.match(voies, /onClick=\{\(\) => toggleRouteDetails\(route\.id\)\}/);
            assert.match(voies, /event\.key !== "Enter" && event\.key !== " "/);
            assert.match(voies, /Détails complets de la voie/);
            for (const label of [
              "Nom :",
              "Corde :",
              "Couleur :",
              "Ouvreur :",
              "Cotation de référence :",
              "Cotation ajustée :",
              "Consensus :",
              "Type :",
              "Caractéristiques :",
              "Note :",
              "Vidéos :",
            ]) {
              assert.match(voies, new RegExp(label));
            }
            assert.match(voies, /formatRouteProgress\(myRouteProgress, route\)/);
          });
          ''')
          PY

          rm .github/workflows/apply-route-expand-collapse.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/src/pages/Voies.jsx frontend/test/route-expand-collapse.test.js .github/workflows/apply-route-expand-collapse.yml
          git commit -m "feat: expand route details on click"
          git push origin HEAD:feature-route-expand-collapse-261007
