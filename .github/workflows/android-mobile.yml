name: Android production APK
on:
  push:
    branches: [mobile/android-ios]
    paths: [mobile/**, .github/workflows/android-mobile.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Build installable test APK
        run: |
          cd android
          ./gradlew assembleDebug lintDebug testDebugUnitTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../CristalClimbClub-production-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CristalClimbClub-production-test
          path: mobile/CristalClimbClub-production-test.apk
          if-no-files-found: error
