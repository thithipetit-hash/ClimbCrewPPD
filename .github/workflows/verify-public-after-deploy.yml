name: Verify Public After Deploy

on:
  workflow_run:
    workflows: ["Validate and Deploy", "Deploy Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && ((github.event.workflow_run.name == 'Validate and Deploy' && github.event.workflow_run.head_branch == 'main' && github.repository == 'thithipetit-hash/ClimbCrewPPD') || github.event.workflow_run.name == 'Deploy Production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Vérifier le marqueur public du déploiement
        env:
          PUBLIC_BASE_URL: ${{ github.event.workflow_run.name == 'Deploy Production' && 'https://climbcrew.dip-tcs.com' || 'https://pre-climbcrew.dip-tcs.com' }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          MARKER_URL="${PUBLIC_BASE_URL}/api/version?verify=${EXPECTED_SHA}"
          for attempt in $(seq 1 24); do
            echo "Tentative ${attempt}/24: ${MARKER_URL}"
            RESPONSE="$(curl --fail --silent --show-error --location --connect-timeout 5 --max-time 10 --header 'Cache-Control: no-cache' "$MARKER_URL" || true)"
            if [ -n "$RESPONSE" ]; then
              ACTUAL_VERSION="$(printf '%s' "$RESPONSE" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const j=JSON.parse(d);process.stdout.write(String(j.version||"").trim())})' 2>/dev/null || true)"
              ACTUAL_COMMIT="$(printf '%s' "$RESPONSE" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const j=JSON.parse(d);process.stdout.write(String(j.commit||"").trim())})' 2>/dev/null || true)"
              echo "Version attendue: $EXPECTED_VERSION · reçue: ${ACTUAL_VERSION:-missing}"
              echo "Commit attendu: $EXPECTED_SHA · reçu: ${ACTUAL_COMMIT:-missing}"
              if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] && [ "$ACTUAL_COMMIT" = "$EXPECTED_SHA" ]; then
                exit 0
              fi
            fi
            [ "$attempt" -eq 24 ] || sleep 5
          done
          echo 'ERROR: le site public ne correspond pas au déploiement validé.'
          exit 1
