name: Regenerate backend lockfile

on:
  push:
    branches:
      - audit-019-complete-hardening

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-019-complete-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate package lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: sync backend package lock"
          git push origin HEAD:audit-019-complete-hardening
