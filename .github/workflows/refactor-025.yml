name: Refactor 025 frontend

on:
  push:
    branches:
      - refactor-025-frontend-maintainability

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-025-frontend-maintainability
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Appliquer le refactor
        run: node .github/scripts/refactor-025.mjs
      - name: Retirer les outils temporaires
        run: rm -f .github/scripts/refactor-025.mjs .github/workflows/refactor-025.yml
      - name: Commit du refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "260907.025 — refactor maintenabilité frontend"
          git push origin HEAD:refactor-025-frontend-maintainability
