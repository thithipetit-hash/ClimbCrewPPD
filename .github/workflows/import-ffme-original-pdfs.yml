name: One-off import original FFME PDFs
on:
  push:
    branches:
      - feature/competences-illustrations-ffme-261027
    paths:
      - .github/workflows/import-ffme-original-pdfs.yml
permissions:
  contents: write
jobs:
  fetch-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install trusted Poppler PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download and verify official FFME PDFs
        run: node frontend/scripts/download-ffme-illustrations.mjs
      - name: Commit original documents and image manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/assets/competences-ffme
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets(ffme): embarquer les 12 PDF originaux et les pages rendues"
            git push origin HEAD:refs/heads/feature/competences-illustrations-ffme-261027
          fi
