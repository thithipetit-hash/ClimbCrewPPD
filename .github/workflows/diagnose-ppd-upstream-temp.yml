name: Diagnose PPD upstream temp

on:
  push:
    branches:
      - diag/ppd-upstream-260908

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnostic frontal PPD lecture seule
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Diagnostiquer les frontaux production et PPD
        shell: bash
        run: |
          set +e
          PPD='pre-climbcrew.dip-tcs.com'
          PROD='climbcrew.dip-tcs.com'
          echo '=== HOTE RUNNER ==='
          hostname
          hostname -I 2>/dev/null || true
          echo
          for DOMAIN in "$PROD" "$PPD"; do
            echo "=== $DOMAIN : DNS ==="
            getent ahosts "$DOMAIN" || true
            echo
            echo "=== $DOMAIN : CERTIFICAT TLS ==="
            if command -v openssl >/dev/null 2>&1; then
              printf '' | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true
            fi
            echo
            echo "=== $DOMAIN : HTTPS DIAGNOSTIC ==="
            SAFE_NAME="${DOMAIN//./-}"
            curl --insecure --silent --show-error --max-time 10 -D - -o "/tmp/${SAFE_NAME}-body" "https://$DOMAIN/deployment-version.json" || true
            head -c 1500 "/tmp/${SAFE_NAME}-body" 2>/dev/null || true
            echo
            echo
          done
          echo '=== NGINX LOCAL PROD ==='
          curl --silent --show-error --max-time 10 -H "Host: $PROD" http://127.0.0.1/deployment-version.json || true
          echo
          echo '=== NGINX LOCAL PPD ==='
          curl --silent --show-error --max-time 10 -H "Host: $PPD" http://127.0.0.1/deployment-version.json || true
          echo
          echo '=== FIN ==='
