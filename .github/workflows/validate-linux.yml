name: Validate ClimbCrew Linux

on:
  workflow_call:
    inputs:
      ref:
        description: Commit ou ref exact à valider
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou ref à valider
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: validate-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, build and runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate canonical version
        shell: bash
        env:
          VERSION_CONSISTENCY_ONLY: "1"
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verify-version.sh
          .github/scripts/verify-version.sh
          printf 'VITE_APP_VERSION=%s\n' "$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Validate source consistency
        run: node scripts/validate-source.mjs

      - name: Run ESLint
        run: npx --yes eslint@10.9.1 --config eslint.config.mjs frontend backend scripts shared

      - name: Validate backend syntax
        run: node --check backend/server.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3), retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright for Android responsive tests
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Android responsive browser tests
        working-directory: frontend
        run: npx playwright test --config=playwright.config.mjs

      - name: Prepare validation environment
        run: cp .env.production.example .env.production

      - name: Validate Docker Compose
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config

      - name: Build Linux images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build

      - name: Start stack
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose --env-file .env.production -f docker-compose.prod.yml up -d; then
            echo "Docker Compose failed while starting the validation stack."
            docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200 backend db backup-init || true
            exit 1
          fi

      - name: Runtime health and authorization smoke tests
        shell: bash
        run: |
          set -euo pipefail

          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done

          if [ "$ready" != true ]; then
            echo "ClimbCrew did not become healthy."
            docker compose --env-file .env.production -f docker-compose.prod.yml ps
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200
            exit 1
          fi

          assert_status() {
            local expected="$1"
            local url="$2"
            local actual
            actual="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")"
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected for $url, got $actual"
              exit 1
            fi
          }

          # Contrats métier minimaux : les données membres et exports ne sont
          # jamais accessibles sans session, même lorsque la pile démarre bien.
          assert_status 401 http://127.0.0.1:3000/participants
          assert_status 401 http://127.0.0.1:3000/admin/export-data
          assert_status 401 http://127.0.0.1:3000/auth/notification-preference

          echo "ClimbCrew runtime and authorization smoke tests succeeded."

      - name: Stop validation stack
        if: always()
        shell: bash
        run: |
          if [ -f .env.production ]; then
            docker compose --env-file .env.production -f docker-compose.prod.yml down -v
          else
            echo "Validation arrêtée avant démarrage de la pile ; aucun nettoyage Docker nécessaire."
          fi
