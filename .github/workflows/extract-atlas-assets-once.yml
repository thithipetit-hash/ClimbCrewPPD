name: Extract atlas assets once

on:
  push:
    branches:
      - perf/static-atlas-assets-20260901-004
    paths:
      - scripts/extract-atlas-assets-once.mjs
      - .github/workflows/extract-atlas-assets-once.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: perf/static-atlas-assets-20260901-004
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Extract Base64 atlas assets
        run: node scripts/extract-atlas-assets-once.mjs

      - name: Commit extracted static assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "perf: move atlas Base64 payloads to static assets"
          git push origin HEAD:perf/static-atlas-assets-20260901-004
