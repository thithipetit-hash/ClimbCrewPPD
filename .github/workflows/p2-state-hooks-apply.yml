name: Apply P2 state hook refactor

on:
  push:
    branches:
      - refactor/frontend-state-hooks-20260830-011
    paths:
      - scripts/apply-p2-state-hooks.mjs
      - .github/workflows/p2-state-hooks-apply.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-state-hooks-20260830-011
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply structural extraction
        run: node scripts/apply-p2-state-hooks.mjs

      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit generated refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(frontend): extract App state into domain hooks"
          git push origin HEAD:refactor/frontend-state-hooks-20260830-011
