name: Diagnostic public production

on:
  push:
    branches:
      - diagnostic-public-production
    paths:
      - .github/workflows/diagnose-public-production.yml

permissions:
  contents: read

jobs:
  inspect_server:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Locate ClimbCrew HTTP target on private subnet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, socket

          host_header = b"climbcrew.dip-tcs.com"

          def probe(i):
              ip = f"10.0.0.{i}"
              try:
                  s = socket.create_connection((ip, 80), timeout=0.35)
                  s.settimeout(0.8)
                  req = b"GET /deployment-version.json HTTP/1.1\r\nHost: " + host_header + b"\r\nConnection: close\r\n\r\n"
                  s.sendall(req)
                  data = b""
                  while len(data) < 5000:
                      chunk = s.recv(4096)
                      if not chunk:
                          break
                      data += chunk
                  s.close()
              except Exception:
                  return None
              text = data.decode("utf-8", "replace")
              low = text.lower()
              if "climbcrew" in low or "nginx" in low or "deployment-version" in low:
                  first = text.replace("\r", "").split("\n")[:30]
                  return ip, "\n".join(first)[:2200]
              return None

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              results = [r for r in ex.map(probe, range(3, 255)) if r]
          print(f"HTTP candidates: {len(results)}")
          for ip, text in results:
              print(f"\n=== {ip}:80 ===")
              print(text)
          PY
