name: Diagnostic public production

on:
  push:
    branches:
      - diagnostic-public-production
    paths:
      - .github/workflows/diagnose-public-production.yml

permissions:
  contents: read

jobs:
  inspect_server:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Locate stale frontend target without changes
        shell: bash
        run: |
          set +e
          echo '=== ALL LISTENERS ==='
          sudo ss -tlnp || true
          echo '=== NGINX EFFECTIVE ROUTING ==='
          sudo nginx -T 2>&1 | grep -E '^(# configuration file |[[:space:]]*(listen|server_name|root|proxy_pass|try_files|client_max_body_size)[[:space:]])' || true
          echo '=== STATIC INDEX CANDIDATES ==='
          sudo find /var/www /srv /opt /usr/share/nginx -type f -name index.html -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -n | tail -n 100 || true
          echo '=== EXACT 2659-BYTE CANDIDATES ==='
          sudo find /var/www /srv /opt /usr/share/nginx -type f -size 2659c -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null || true
          echo '=== LOCAL CLIMBCREW HTML CANDIDATES ==='
          while IFS= read -r F; do
            if sudo grep -q '<title>ClimbCrew</title>' "$F" 2>/dev/null; then
              sudo stat -c '%s %y %n' "$F" 2>/dev/null
            fi
          done < <(sudo find /var/www /srv /opt /usr/share/nginx -type f -name '*.html' 2>/dev/null)
