name: Diagnostic public production

on:
  push:
    branches:
      - diagnostic-public-production
    paths:
      - .github/workflows/diagnose-public-production.yml

permissions:
  contents: read

jobs:
  inspect_server:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect cloud identity without exposing secrets
        shell: bash
        run: |
          set +e
          echo '=== HOST IDENTITY ==='
          hostname
          hostname -f || true
          cloud-init query instance_id 2>/dev/null || true
          cloud-init query local_hostname 2>/dev/null || true
          echo '=== OPENSTACK CLIENT ==='
          command -v openstack || true
          openstack --version 2>/dev/null || true
          echo '=== OPENSTACK ENV NAMES ONLY ==='
          env | cut -d= -f1 | grep -E '^OS_' | sort || true
          echo '=== INTERNAL DNS ==='
          for NAME in pre-climbcrew climbcrew prod-climbcrew climbcrew-prod climbcrew-production production-climbcrew; do
            printf '%-24s ' "$NAME"
            getent ahostsv4 "$NAME" 2>/dev/null | awk 'NR==1{print $1}' || true
          done
          echo '=== RESOLVER ==='
          resolvectl status 2>/dev/null | sed -n '1,180p' || true
