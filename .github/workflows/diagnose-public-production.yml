name: Diagnostic public production

on:
  push:
    branches:
      - diagnostic-public-production
    paths:
      - .github/workflows/diagnose-public-production.yml

permissions:
  contents: read

jobs:
  inspect_server:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check existing SSH access to production VM
        shell: bash
        run: |
          set +e
          TARGET=10.0.0.118
          echo '=== LOCAL USER ==='
          id -un
          echo '=== SSH KEY FILENAMES ==='
          find "$HOME/.ssh" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | grep -vE 'known_hosts|config' || true
          echo '=== PORT 22 ==='
          timeout 3 bash -c "</dev/tcp/${TARGET}/22" && echo open || echo closed
          echo '=== SSH ATTEMPTS (BATCH MODE) ==='
          for USER in "$(id -un)" ubuntu debian root; do
            echo "-- ${USER}@${TARGET} --"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=4 -o ConnectionAttempts=1 "${USER}@${TARGET}" \
              'printf "hostname="; hostname; printf "user="; id -un; printf "cwd="; pwd; test -d /opt/climbcrew && echo deploy_root=/opt/climbcrew || true' 2>&1 | head -n 20
            RC=${PIPESTATUS[0]}
            echo "rc=${RC}"
            [ "$RC" -eq 0 ] && exit 0
          done
          exit 2
