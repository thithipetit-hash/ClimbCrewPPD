# =============================================================================
# Déploiement de production sur serveur Linux avec Docker Compose
# =============================================================================
# Ce fichier reste indépendant de render.yaml. Il orchestre localement la base,
# l'API et le frontend derrière le reverse proxy HTTPS déjà présent sur le serveur.

services:
  # ---------------------------------------------------------------------------
  # Base PostgreSQL locale au réseau Docker.
  # Impact visuel : les données affichées dans toutes les pages proviennent de
  # ce volume. Le conteneur n'est jamais publié directement sur Internet.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: climbcrew-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - climbcrew_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Prépare le répertoire de sauvegardes du serveur pour l'utilisateur non-root
  # du backend. Les fichiers sont physiquement conservés dans /opt/climbcrew/backups
  # lorsque Compose est lancé depuis /opt/climbcrew.
  # ---------------------------------------------------------------------------
  backup-init:
    image: alpine:3.21
    container_name: climbcrew-backup-init
    restart: "no"
    command: ["sh", "-c", "mkdir -p /backups && chown -R 1000:1000 /backups && chmod 750 /backups"]
    volumes:
      - ./backups:/backups

  # ---------------------------------------------------------------------------
  # API Node/Express.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: climbcrew-backend:prod
    container_name: climbcrew-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: /backups
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Paris}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RECIPIENT: ${BACKUP_RECIPIENT:-cristal.climbcrew@gmail.com}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_UPLOAD_MAX_BYTES: ${BACKUP_UPLOAD_MAX_BYTES:-52428800}
    ports:
      - "127.0.0.1:${BACKEND_BIND_PORT:-3000}:3000"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      backup-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend React compilé puis servi par Nginx. Son contexte est la racine du
  # dépôt afin de fournir le fichier VERSION canonique au Dockerfile.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        GITHUB_SHA: ${DEPLOY_COMMIT_SHA:-unknown}
    image: climbcrew-frontend:prod
    container_name: climbcrew-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_BIND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  climbcrew_pgdata:
